<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="theme-color" content="#17140f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NARETH" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>NARETH</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140f;color:#e8d3a8;font-family:Georgia,serif}
body{display:grid;place-items:center}
#brand{font-size:34px;font-weight:700;letter-spacing:2px;opacity:.95}
</style>
</head>
<body>
<div id="brand">NARETH</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
    const data=await r.json();
    const v=encodeURIComponent(String(data.version||Date.now()));
    location.replace('./?v='+v+'&from=launcher');
  }catch(_){
    location.replace('./?v='+Date.now()+'&from=launcher');
  }
})();
</script>
</body>
</html>
