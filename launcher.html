<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#17140f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NARETH"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>NARETH</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140f;color:#e8d3a8;font-family:Georgia,serif}body{display:grid;place-items:center}#brand{font-size:34px;font-weight:700;letter-spacing:2px}</style></head><body><div id="brand">NARETH</div><script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'}),d=await r.json(),v=encodeURIComponent(String(d.version||Date.now()));location.replace('./app.html?v='+v+'&from=launcher')}catch(_){location.replace('./app.html?v='+Date.now()+'&from=launcher')}})();</script></body></html>
