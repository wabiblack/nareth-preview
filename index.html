<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#17140f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NARETH" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<title>NARETH Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17140f;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
*,*::before,*::after{-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important;-webkit-tap-highlight-color:transparent!important}
canvas{position:fixed;left:0;top:0;display:block;background:#17140f;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;transform-origin:top left}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const block=e=>e.preventDefault();
  for(const ev of ['contextmenu','selectstart','dragstart']) document.addEventListener(ev,block,{capture:true});
  for(const ev of ['gesturestart','gesturechange','gestureend']) document.addEventListener(ev,block,{capture:true,passive:false});
  if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if('caches' in window) caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});

  const canvas=document.getElementById('game');
  for(const ev of ['contextmenu','selectstart','dragstart']) canvas.addEventListener(ev,block,{capture:true});
  const ctx=canvas.getContext('2d');
  const DPR=Math.min(devicePixelRatio||1,2);
  const WORLD={w:1600,h:1000};
  const SAVE_KEY='nareth-preview-save-v2';
  const CLOCK_SPEED=3;
  const player={x:720,y:515,speed:230,money:12,inventory:{grain:0}};
  const clock={day:1,minutes:7*60+30,lastSavedBucket:-1};

  const Z={
    homes:{x1:120,y1:455,x2:320,y2:575},
    inn:{x1:510,y1:475,x2:710,y2:570},
    smith:{x1:850,y1:500,x2:1040,y2:590},
    field:{x1:220,y1:700,x2:570,y2:900},
    river:{x1:1050,y1:650,x2:1160,y2:900},
    market:{x1:650,y1:570,x2:980,y2:700},
    road:{x1:900,y1:500,x2:1120,y2:610}
  };

  const npcs=[
    {name:'Daren',job:'Demirci',x:930,y:520,speed:42,zone:Z.smith,greeting:'Bir şey yaptıracaksan söyle. Boş muhabbet için körüğü söndürmem.',work:'Demircilik yaparım. İstersen zamanla sana da öğretirim ama önce elinin işe yatkın olduğunu görmem lazım.',local:'Karaova küçük yer. Herkes birbirini tanır ama herkes birbirine güvenmez.',routine:[{from:0,to:7,zone:'homes',activity:'Uyuyor'},{from:7,to:18,zone:'smith',activity:'Atölyede çalışıyor'},{from:18,to:21,zone:'inn',activity:'Handa dinleniyor'},{from:21,to:24,zone:'homes',activity:'Evine döndü'}]},
    {name:'Mira',job:'Hancı',x:600,y:500,speed:38,zone:Z.inn,greeting:'Hoş geldin. Oda mı arıyorsun, iş mi, yoksa sadece etrafı mı kokluyorsun?',work:'Hanı işletiyorum. Akşamları küçük sahnemiz de olur. Bir şey çalabiliyorsan dinleriz.',local:'Karaova fakir ama yol üstünde. Kül Yolu kapanmadığı sürece burası yaşamaya devam eder.',routine:[{from:0,to:6,zone:'inn',activity:'Hanı kapatmış'},{from:6,to:10,zone:'inn',activity:'Hanı açıyor'},{from:10,to:15,zone:'market',activity:'Pazar işlerini hallediyor'},{from:15,to:24,zone:'inn',activity:'Hanı işletiyor'}]},
    {name:'Torven',job:'Çiftçi',x:360,y:760,speed:35,zone:Z.field,greeting:'Hasattan biraz tahıl ayırdım. Çuvalı 3 sikke. Alacaksan söyle.',work:'Tarla, hayvan, hasat... İş bitmez. Güçlüysen günlük iş de çıkar sana.',local:'Veyra pazarı iyi fiyat verirse bu sene nefes alırız. Vermezse yine borca yazarız.',trade:{mode:'sell',item:'grain',label:'Tahıl çuvalı',price:3,stock:6},routine:[{from:0,to:6,zone:'homes',activity:'Uyuyor'},{from:6,to:17,zone:'field',activity:'Tarlada çalışıyor'},{from:17,to:20,zone:'market',activity:'Pazarda'},{from:20,to:24,zone:'homes',activity:'Evine döndü'}]},
    {name:'Sela',job:'Balıkçı',x:1125,y:780,speed:34,zone:Z.river,greeting:'Sessiz ol. Balık senden daha sabırlı.',work:'Nehirden ne çıkarsa satarım. İstersen sana olta tutmayı da gösterebilirim.',local:'Nehir sakin görünür ama kuzeye gittikçe işler değişir. Karaova tarafı yine güvenli sayılır.',routine:[{from:0,to:5,zone:'homes',activity:'Uyuyor'},{from:5,to:16,zone:'river',activity:'Balık tutuyor'},{from:16,to:19,zone:'market',activity:'Balık satıyor'},{from:19,to:24,zone:'homes',activity:'Evine döndü'}]},
    {name:'Orik',job:'Tüccar',x:760,y:650,speed:50,zone:Z.market,greeting:'Karaova tahılı getirirsen çuvalına 5 sikke veririm. Veyra yolunda hâlâ alıcısı var.',work:'Karaova ile Veyra arasında mal taşırım. Ucuza alıp pahalıya satmak ayıp değil, meslektir.',local:'Kül Yolu bugün açık. Yarın açık olur mu, onu kimse bilmez.',trade:{mode:'buy',item:'grain',label:'Tahıl çuvalı',price:5,cash:25},routine:[{from:0,to:7,zone:'inn',activity:'Handa kalıyor'},{from:7,to:10,zone:'road',activity:'Kül Yolu tarafında'},{from:10,to:18,zone:'market',activity:'Ticaret yapıyor'},{from:18,to:21,zone:'road',activity:'Yol hazırlığı yapıyor'},{from:21,to:24,zone:'inn',activity:'Handa kalıyor'}]}
  ];

  function getRoutine(n){const h=(clock.minutes/60)%24;return n.routine.find(r=>h>=r.from&&h<r.to)||n.routine[0]}
  function applyRoutine(n,force=false){const r=getRoutine(n);if(!force&&n.routineKey===`${clock.day}:${r.zone}:${r.activity}`)return;n.routineKey=`${clock.day}:${r.zone}:${r.activity}`;n.activity=r.activity;n.zone=Z[r.zone];n.targetX=(n.zone.x1+n.zone.x2)/2;n.targetY=(n.zone.y1+n.zone.y2)/2;n.wait=0;n.moving=true}
  for(const n of npcs){n.targetX=n.x;n.targetY=n.y;n.wait=.2+Math.random();n.moving=false;applyRoutine(n,true)}

  function loadState(){
    try{
      const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s)return;
      if(Number.isFinite(s.money))player.money=s.money;
      if(Number.isFinite(s.grain))player.inventory.grain=Math.max(0,s.grain);
      if(Number.isFinite(s.day))clock.day=Math.max(1,Math.floor(s.day));
      if(Number.isFinite(s.minutes))clock.minutes=((s.minutes%1440)+1440)%1440;
      const torven=npcs.find(n=>n.name==='Torven'),orik=npcs.find(n=>n.name==='Orik');
      if(Number.isFinite(s.torvenStock))torven.trade.stock=Math.max(0,s.torvenStock);
      if(Number.isFinite(s.orikCash))orik.trade.cash=Math.max(0,s.orikCash);
      for(const n of npcs)applyRoutine(n,true);
    }catch(_){}
  }
  function saveState(){
    try{
      const torven=npcs.find(n=>n.name==='Torven'),orik=npcs.find(n=>n.name==='Orik');
      localStorage.setItem(SAVE_KEY,JSON.stringify({money:player.money,grain:player.inventory.grain,day:clock.day,minutes:clock.minutes,torvenStock:torven.trade.stock,orikCash:orik.trade.cash}));
    }catch(_){}
  }
  loadState();

  const trees=Array.from({length:34},(_,i)=>({x:70+((i*197)%1460),y:70+((i*313)%850),r:13+(i%8)})).filter(t=>!(t.x>1120&&t.x<1450)&&!(t.x>120&&t.x<640&&t.y>640));
  let viewW=0,viewH=0,rawW=0,rawH=0,portraitFallback=false,camX=0,camY=0,last=performance.now();
  let stick={id:null,dx:0,dy:0},toast='',toastUntil=0,dialogue=null;

  function physicalViewport(){const vv=window.visualViewport;return{w:Math.max(1,Math.round((vv&&vv.width)||document.documentElement.clientWidth||innerWidth)),h:Math.max(1,Math.round((vv&&vv.height)||document.documentElement.clientHeight||innerHeight))}}
  function resize(){const p=physicalViewport();rawW=p.w;rawH=p.h;portraitFallback=rawH>rawW;if(portraitFallback){viewW=rawH;viewH=rawW;canvas.style.width=viewW+'px';canvas.style.height=viewH+'px';canvas.style.transform='rotate(90deg) translateY(-100%)'}else{viewW=rawW;viewH=rawH;canvas.style.width=viewW+'px';canvas.style.height=viewH+'px';canvas.style.transform='none'}canvas.width=Math.max(1,Math.floor(viewW*DPR));canvas.height=Math.max(1,Math.floor(viewH*DPR));ctx.setTransform(DPR,0,0,DPR,0,0)}
  function forceResize(){[0,60,160,320,650].forEach(ms=>setTimeout(resize,ms))}
  addEventListener('resize',forceResize);addEventListener('orientationchange',forceResize);addEventListener('pageshow',forceResize);if(window.visualViewport)window.visualViewport.addEventListener('resize',forceResize);document.addEventListener('visibilitychange',()=>{if(!document.hidden)forceResize();else saveState()});resize();

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
  function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
  function label(text,x,y,size=14,color='#ead9b5',align='center'){ctx.font=`600 ${size}px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#241c16';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y)}
  function wrapText(text,x,y,maxWidth,lineHeight,maxLines=3){const words=text.split(' ');let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines=lines.slice(0,maxLines);for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],x,y+i*lineHeight)}
  function building(x,y,w,h,wall,roof,name){ctx.fillStyle='rgba(20,16,13,.35)';ctx.fillRect(x+12,y+18,w,h);ctx.fillStyle=wall;ctx.fillRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x-18,y+25);ctx.lineTo(x+w/2,y-75);ctx.lineTo(x+w+18,y+25);ctx.closePath();ctx.fillStyle=roof;ctx.fill();ctx.fillStyle='#30241d';ctx.fillRect(x+w/2-24,y+h-62,48,62);label(name,x+w/2,y+h+18,16)}
  function nearestNPC(){let best=null,bestD=Infinity;for(const n of npcs){const d=dist(player.x,player.y,n.x,n.y);if(d<bestD){bestD=d;best=n}}return{npc:best,d:bestD}}

  function worldDraw(){
    ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#77784c';ctx.fillRect(0,0,WORLD.w,WORLD.h);
    ctx.strokeStyle='#a6875d';ctx.lineWidth=100;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,530);ctx.lineTo(520,520);ctx.lineTo(920,590);ctx.lineTo(1600,520);ctx.stroke();ctx.strokeStyle='rgba(112,86,62,.55)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,530);ctx.lineTo(520,520);ctx.lineTo(920,590);ctx.lineTo(1600,520);ctx.stroke();
    ctx.fillStyle='#456b75';ctx.fillRect(1180,0,230,WORLD.h);ctx.fillStyle='rgba(99,137,149,.7)';for(let y=40;y<WORLD.h;y+=70){ctx.fillRect(1205,y,110,5);ctx.fillRect(1290,y+28,80,4)}
    ctx.fillStyle='#64583c';ctx.fillRect(170,680,440,245);ctx.strokeStyle='#a28e55';ctx.lineWidth=5;for(let y=705;y<910;y+=30){ctx.beginPath();ctx.moveTo(195,y);ctx.lineTo(585,y);ctx.stroke()}
    building(475,310,250,160,'#72523d','#47352d','KARAOVA HANI');building(825,345,220,145,'#66544a','#3f3530','DEMİRCİ');building(690,720,210,135,'#80684e','#554332','PAZAR DEPOSU');building(100,300,190,125,'#78634d','#4d3e32','EVLER');
    for(let i=0;i<4;i++){const x=660+i*90;ctx.fillStyle='#4e3b2c';ctx.fillRect(x,610,66,38);ctx.beginPath();ctx.moveTo(x-5,610);ctx.lineTo(x+71,610);ctx.lineTo(x+33,580);ctx.closePath();ctx.fillStyle=i%2?'#8b794f':'#9f5f42';ctx.fill()}
    ctx.fillStyle='#5a4532';ctx.fillRect(1160,500,270,85);for(let x=1170;x<1420;x+=28){ctx.fillStyle='#8a6b49';ctx.fillRect(x,508,20,70)}
    for(const t of trees){ctx.fillStyle='#48563b';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#66704a';ctx.beginPath();ctx.arc(t.x-6,t.y-9,t.r*.55,0,Math.PI*2);ctx.fill()}
    label('KARAOVA',42,42,30,'#e5d1a7','left');const near=nearestNPC();
    for(const n of npcs){const isNear=near.npc===n&&near.d<=145;if(isNear){ctx.fillStyle='rgba(224,199,150,.16)';ctx.beginPath();ctx.arc(n.x,n.y,30,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(29,25,21,.35)';ctx.beginPath();ctx.ellipse(n.x,n.y+15,18,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=n.moving?'#725846':'#655143';ctx.fillRect(n.x-12,n.y-18,24,36);ctx.fillStyle='#b48663';ctx.beginPath();ctx.arc(n.x,n.y-25,10,0,Math.PI*2);ctx.fill();label(n.name,n.x,n.y-52,isNear?14:12,isNear?'#ffe0a9':'#ead9b5');label(n.activity,n.x,n.y-37,10,'#cbb997')}
    ctx.fillStyle='rgba(29,25,21,.4)';ctx.beginPath();ctx.ellipse(player.x,player.y+17,20,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f3431';ctx.fillRect(player.x-14,player.y-20,28,40);ctx.fillStyle='#8a4937';ctx.fillRect(player.x-16,player.y-14,32,7);ctx.fillStyle='#b58b68';ctx.beginPath();ctx.arc(player.x,player.y-26,12,0,Math.PI*2);ctx.fill();label('SEN',player.x,player.y-53,12,'#f1dfb9');ctx.restore();
  }

  function drawTimeTint(){const h=clock.minutes/60;let a=0;if(h<5)a=.36;else if(h<7)a=.36-(h-5)*.18;else if(h<18)a=0;else if(h<20)a=(h-18)*.15;else a=.30;if(a>0){ctx.fillStyle=`rgba(17,24,39,${a})`;ctx.fillRect(0,0,viewW,viewH)}}
  function timeText(){const total=Math.floor(clock.minutes)%1440,h=Math.floor(total/60),m=total%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}

  function dialogueLayout(){const w=Math.min(650,viewW*.72),h=188,x=(viewW-w)/2,y=viewH-h-14;const defs=[{id:'work',text:'İŞİN NE?'},{id:'local',text:'KARAOVA?'}];if(dialogue&&dialogue.npc.trade){const t=dialogue.npc.trade;defs.push({id:'trade',text:t.mode==='sell'?`AL • ${t.price}`:`SAT • ${t.price}`})}defs.push({id:'close',text:'GÖRÜŞÜRÜZ'});const gap=7,btnY=y+h-47,btnW=(w-32-gap*(defs.length-1))/defs.length;return{x,y,w,h,buttons:defs.map((d,i)=>({...d,x:x+16+i*(btnW+gap),y:btnY,w:btnW,h:33}))}}
  function tradeStatus(n){if(!n.trade)return'';if(n.trade.mode==='sell')return`Stok: ${n.trade.stock} çuval • Fiyat: ${n.trade.price} sikke`;return`Orik'in parası: ${n.trade.cash} sikke • Alış: ${n.trade.price}`}
  function drawDialogue(){if(!dialogue)return;const l=dialogueLayout(),n=dialogue.npc;roundRect(l.x,l.y,l.w,l.h,12,'rgba(25,21,18,.97)','#9b7a55');ctx.font='700 18px Georgia,serif';ctx.fillStyle='#f0d7a8';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(n.name,l.x+18,l.y+13);ctx.font='12px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#a99a80';ctx.fillText(`${n.job} • ${n.activity}`,l.x+18,l.y+37);if(n.trade){ctx.textAlign='right';ctx.fillStyle='#d7bd8e';ctx.fillText(tradeStatus(n),l.x+l.w-18,l.y+37);ctx.textAlign='left'}ctx.font='600 14px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#f0e3cb';wrapText(dialogue.text,l.x+18,l.y+61,l.w-36,19,3);for(const b of l.buttons){roundRect(b.x,b.y,b.w,b.h,8,b.id==='trade'?'rgba(113,83,45,.96)':'rgba(91,70,52,.88)',b.id==='trade'?'#e2b969':'#b39168');ctx.font='700 11px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#f4dfba';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.text,b.x+b.w/2,b.y+b.h/2+1)}}

  function hud(){
    roundRect(16,14,318,104,10,'rgba(28,24,20,.9)','#7f674a');ctx.font='700 24px Georgia,serif';ctx.fillStyle='#e8d3a8';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('NARETH',32,45);ctx.font='14px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#d2bf9e';ctx.fillText(`YS 327 • Gün ${clock.day} • ${timeText()}`,32,72);ctx.fillStyle='#b9aa8d';ctx.fillText(`Karaova • ${player.money} sikke`,32,96);
    roundRect(viewW-206,14,190,66,10,'rgba(28,24,20,.9)','#7f674a');ctx.font='700 12px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#d8c39d';ctx.textAlign='left';ctx.fillText('ÇANTA',viewW-190,38);ctx.font='13px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.fillStyle='#f0dfbd';ctx.fillText(`Tahıl çuvalı  x${player.inventory.grain}`,viewW-190,61);
    if(!dialogue){const bx=92,by=viewH-92;ctx.beginPath();ctx.arc(bx,by,61,0,Math.PI*2);ctx.fillStyle='rgba(23,20,17,.5)';ctx.fill();ctx.strokeStyle='rgba(192,167,124,.4)';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(bx+stick.dx,by+stick.dy,27,0,Math.PI*2);ctx.fillStyle='rgba(192,167,124,.55)';ctx.fill();const ax=viewW-90,ay=viewH-92,near=nearestNPC();ctx.beginPath();ctx.arc(ax,ay,47,0,Math.PI*2);ctx.fillStyle=near.d<=130?'rgba(117,82,53,.96)':'rgba(94,68,50,.9)';ctx.fill();ctx.strokeStyle=near.d<=130?'#f0c889':'#d2b58a';ctx.lineWidth=3;ctx.stroke();ctx.font='700 12px -apple-system,BlinkMacSystemFont,Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f3dfb9';ctx.fillText('ETKİLEŞ',ax,ay+4)}
    if(performance.now()<toastUntil&&!dialogue){ctx.font='600 14px -apple-system,BlinkMacSystemFont,Segoe UI';const w=Math.min(viewW-40,ctx.measureText(toast).width+34);roundRect(viewW/2-w/2,viewH-58,w,38,10,'rgba(36,30,24,.94)','#6f5d49');ctx.fillStyle='#f4e5c5';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(toast,viewW/2,viewH-35)}drawDialogue();
  }

  function chooseTarget(n){n.targetX=n.zone.x1+Math.random()*(n.zone.x2-n.zone.x1);n.targetY=n.zone.y1+Math.random()*(n.zone.y2-n.zone.y1);n.moving=true}
  function updateClock(dt){const beforeDay=clock.day;clock.minutes+=dt*CLOCK_SPEED;if(clock.minutes>=1440){clock.minutes-=1440;clock.day++;toast=`Gün ${clock.day} başladı.`;toastUntil=performance.now()+2200}for(const n of npcs)applyRoutine(n);const bucket=Math.floor(clock.minutes/30);if(bucket!==clock.lastSavedBucket||clock.day!==beforeDay){clock.lastSavedBucket=bucket;saveState()}}
  function updateNPCs(dt){for(const n of npcs){if(dialogue&&dialogue.npc===n){n.moving=false;continue}if(n.wait>0){n.wait-=dt;n.moving=false;continue}const dx=n.targetX-n.x,dy=n.targetY-n.y,d=Math.hypot(dx,dy);if(d<5){n.wait=.8+Math.random()*2.4;chooseTarget(n);n.moving=false;continue}n.moving=true;n.x+=dx/d*n.speed*dt;n.y+=dy/d*n.speed*dt}}
  function interact(){if(dialogue){dialogue=null;return}const near=nearestNPC();if(near.d<=130){dialogue={npc:near.npc,text:near.npc.greeting};stick.id=null;stick.dx=0;stick.dy=0}else{toast='Yakında etkileşime girecek kimse yok.';toastUntil=performance.now()+1800}}
  function doTrade(n){const t=n.trade;if(!t)return;if(t.mode==='sell'){if(t.stock<=0){dialogue.text='Bugünlük satacak tahılım kalmadı.';return}if(player.money<t.price){dialogue.text=`O çuval ${t.price} sikke. Sende o kadar yok.`;return}player.money-=t.price;player.inventory[t.item]=(player.inventory[t.item]||0)+1;t.stock--;dialogue.text=`Bir ${t.label.toLowerCase()} aldın. ${t.price} sikke verdin. Çantanda ${player.inventory[t.item]} çuval var.`}else{if((player.inventory[t.item]||0)<=0){dialogue.text='Satacak tahılın yok. Önce bir yerden mal bul.';return}if(t.cash<t.price){dialogue.text='Bugün alış için ayırdığım para bitti. Sonra gel.';return}player.inventory[t.item]--;player.money+=t.price;t.cash-=t.price;dialogue.text=`Orik bir çuval tahılı ${t.price} sikkeye aldı. Şimdi ${player.money} sikken var.`}saveState()}
  function handleDialogueTap(p){if(!dialogue)return false;const l=dialogueLayout();for(const b of l.buttons){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){if(b.id==='work')dialogue.text=dialogue.npc.work;else if(b.id==='local')dialogue.text=dialogue.npc.local;else if(b.id==='trade')doTrade(dialogue.npc);else dialogue=null;return true}}return true}
  function update(dt){updateClock(dt);updateNPCs(dt);if(!dialogue&&(stick.dx||stick.dy)){const len=Math.hypot(stick.dx,stick.dy)||1;player.x=clamp(player.x+(stick.dx/len)*player.speed*dt,35,WORLD.w-35);player.y=clamp(player.y+(stick.dy/len)*player.speed*dt,35,WORLD.h-35)}camX=clamp(player.x-viewW/2,0,Math.max(0,WORLD.w-viewW));camY=clamp(player.y-viewH/2,0,Math.max(0,WORLD.h-viewH))}
  function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);ctx.clearRect(0,0,viewW,viewH);worldDraw();drawTimeTint();hud();requestAnimationFrame(frame)}
  function pointerPos(e){if(portraitFallback)return{x:e.clientY,y:rawW-e.clientX};return{x:e.clientX,y:e.clientY}}
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pointerPos(e);if(dialogue){handleDialogueTap(p);return}const bx=92,by=viewH-92,ax=viewW-90,ay=viewH-92;if(dist(p.x,p.y,ax,ay)<65){interact();return}if(dist(p.x,p.y,bx,by)<90&&stick.id===null){stick.id=e.pointerId;try{canvas.setPointerCapture(e.pointerId)}catch(_){}moveStick(p.x,p.y)}});
  canvas.addEventListener('pointermove',e=>{if(e.pointerId===stick.id&&!dialogue){e.preventDefault();const p=pointerPos(e);moveStick(p.x,p.y)}});
  function release(e){if(e.pointerId===stick.id){stick.id=null;stick.dx=0;stick.dy=0}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
  function moveStick(x,y){const bx=92,by=viewH-92;let dx=x-bx,dy=y-by;const len=Math.hypot(dx,dy),m=47;if(len>m){dx=dx/len*m;dy=dy/len*m}stick.dx=dx;stick.dy=dy}
  forceResize();requestAnimationFrame(frame);
})();
</script>
